<div class="tela-centro">
  <div class="patinhas-fundo patinhas-claras"></div>
  <form class="cartao-entrada" (ngSubmit)="confirmar()" novalidate>
    <img src="img/prancheta.webp" alt="" class="entrada-avatar" width="72" height="72">
    <h2>Confirmar senha</h2>
    <p class="texto-suave">Digite o código de 6 números. Nesta demonstração o "e-mail" é simulado: o código aparece no terminal da API da clínica.</p>

    @if (mensagem) {
      <div class="alerta-inline alerta-{{ tipo }}" role="alert"><span>{{ mensagem }}</span></div>
    }

    <label class="form-label" for="email">E-mail</label>
    <input id="email" name="email" type="email" class="form-control" [(ngModel)]="email" required>

    <label class="form-label mt-3" for="codigo">Código</label>
    <input id="codigo" name="codigo" class="form-control campo-codigo" inputmode="numeric" maxlength="6" [(ngModel)]="codigo" placeholder="000000" required>

    <button type="submit" class="btn btn-primario w-100 mt-4" [disabled]="carregando">Confirmar senha</button>
    <button type="button" class="btn btn-claro w-100 mt-2" (click)="reenviar()">Reenviar código</button>
    <div class="text-center mt-3"><a routerLink="/login"><i class="bi bi-arrow-left"></i> Voltar para o login</a></div>
  </form>
</div>
