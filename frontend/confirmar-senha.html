<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar senha - Clínica Vet</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<main class="container">
    <div class="caixa-login">
        <h1 class="h3 text-center mb-4">Confirmar senha</h1>
        <div id="mensagens"></div>

        <div class="card shadow-sm">
            <div class="card-body">
                <p class="texto-pequeno text-muted">
                    O e-mail é simulado: o código de 6 números aparece no <strong>terminal onde a API da clínica
                    está rodando</strong> (npm start). Ele vale 15 minutos.
                </p>
                <form id="formConfirmar" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="codigo" class="form-label">Código de confirmação</label>
                        <input type="text" class="form-control" id="codigo" name="codigo" inputmode="numeric" maxlength="6" placeholder="000000">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Confirmar senha</button>
                        <button type="button" id="botaoReenviar" class="btn btn-outline-secondary">Enviar um código novo</button>
                    </div>
                </form>
                <p class="mt-3 mb-0 text-center texto-pequeno"><a href="index.html">Voltar para o login</a></p>
            </div>
        </div>
    </div>
</main>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/comum.js"></script>
<script src="js/confirmar-senha.js"></script>
</body>
</html>
