<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinários - Clínica Vet</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div id="menu"></div>
<main class="container py-3">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0">Veterinários</h1>
        <button id="botaoNovo" class="btn btn-primary">Novo veterinário</button>
    </div>
    <div id="mensagens"></div>

    <div class="card mb-3 d-none" id="cartaoFormulario">
        <div class="card-header" id="tituloFormulario">Novo veterinário</div>
        <div class="card-body">
            <form id="formVeterinario" novalidate>
                <div class="row g-2">
                    <div class="col-md-6">
                        <label class="form-label" for="nome">Nome completo *</label>
                        <input class="form-control" id="nome" name="nome" maxlength="150">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="cpf">CPF *</label>
                        <input class="form-control" id="cpf" name="cpf" inputmode="numeric" maxlength="14">
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label" for="crmv">CRMV *</label>
                        <input class="form-control" id="crmv" name="crmv" inputmode="numeric" maxlength="10">
                    </div>
                    <div class="col-6 col-md-1">
                        <label class="form-label" for="ufCrmv">UF *</label>
                        <select class="form-select" id="ufCrmv" name="ufCrmv"></select>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label" for="email">E-mail (login) *</label>
                        <input type="email" class="form-control" id="email" name="email" maxlength="150">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="telefone">Telefone</label>
                        <input class="form-control" id="telefone" name="telefone" maxlength="20">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="senha">Senha <span id="obsSenha">*</span></label>
                        <input type="password" class="form-control" id="senha" name="senha" maxlength="72" autocomplete="new-password">
                        <div class="form-text">Mínimo 8 caracteres. Depois de salvar, a senha precisa ser confirmada com o código que aparece no terminal da API.</div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-success">Salvar</button>
                    <button type="button" class="btn btn-outline-secondary" id="botaoCancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <form id="formFiltro" class="row g-2 mb-2">
        <div class="col-8 col-md-3">
            <select class="form-select" name="status">
                <option value="">Todos</option>
                <option value="ativo">Ativos</option>
                <option value="inativo">Inativos</option>
            </select>
        </div>
        <div class="col-4 col-md-2 d-grid">
            <button class="btn btn-outline-primary" type="submit">Filtrar</button>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Nome</th><th>CRMV</th><th>E-mail</th><th>Telefone</th><th>Senha</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead>
                <tbody id="tabelaVeterinarios"><tr><td colspan="8" class="text-center text-muted py-3">Carregando...</td></tr></tbody>
            </table>
        </div>
    </div>
</main>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/comum.js"></script>
<script src="js/veterinarios.js"></script>
</body>
</html>
