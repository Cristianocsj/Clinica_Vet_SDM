<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutores - Clínica Vet</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div id="menu"></div>
<main class="container py-3">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0">Tutores</h1>
        <button id="botaoNovo" class="btn btn-primary">Novo tutor</button>
    </div>
    <div id="mensagens"></div>

    <!-- Formulário de cadastro/alteração (fica escondido até clicar em Novo ou Editar) -->
    <div class="card mb-3 d-none" id="cartaoFormulario">
        <div class="card-header" id="tituloFormulario">Novo tutor</div>
        <div class="card-body">
            <form id="formTutor" novalidate>
                <div class="row g-2">
                    <div class="col-md-6">
                        <label class="form-label" for="nome">Nome completo *</label>
                        <input class="form-control" id="nome" name="nome" maxlength="150" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="cpf">CPF *</label>
                        <input class="form-control" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="dataNascimento">Data de nascimento</label>
                        <input type="date" class="form-control" id="dataNascimento" name="dataNascimento">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="email">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" maxlength="150">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="telefone">Telefone</label>
                        <input class="form-control" id="telefone" name="telefone" maxlength="20" placeholder="(11) 99999-9999">
                    </div>
                </div>

                <h2 class="h6 mt-3">Endereço</h2>
                <div class="row g-2">
                    <div class="col-md-3">
                        <label class="form-label" for="cep">CEP *</label>
                        <div class="input-group">
                            <input class="form-control" id="cep" name="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" required>
                            <button class="btn btn-outline-secondary" type="button" id="botaoCep">Buscar</button>
                        </div>
                        <div class="form-text" id="avisoCep">Digite o CEP e clique em Buscar (ViaCEP).</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="logradouro">Logradouro</label>
                        <input class="form-control" id="logradouro" name="logradouro" maxlength="200">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="numero">Número</label>
                        <input class="form-control" id="numero" name="numero" maxlength="10">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="complemento">Complemento</label>
                        <input class="form-control" id="complemento" name="complemento" maxlength="100">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="bairro">Bairro</label>
                        <input class="form-control" id="bairro" name="bairro" maxlength="100">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="cidade">Cidade *</label>
                        <input class="form-control" id="cidade" name="cidade" maxlength="100" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label" for="uf">UF *</label>
                        <select class="form-select" id="uf" name="uf" required></select>
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label" for="codigoIbge">Código IBGE</label>
                        <input class="form-control" id="codigoIbge" name="codigoIbge" maxlength="7" readonly>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-success">Salvar</button>
                    <button type="button" class="btn btn-outline-secondary" id="botaoCancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Filtros e lista -->
    <form id="formFiltro" class="row g-2 mb-2">
        <div class="col-md-6">
            <input class="form-control" name="busca" placeholder="Buscar por nome ou CPF">
        </div>
        <div class="col-8 col-md-3">
            <select class="form-select" name="situacao">
                <option value="ativo">Ativos</option>
                <option value="inativo">Inativos</option>
                <option value="">Todos</option>
            </select>
        </div>
        <div class="col-4 col-md-3 d-grid">
            <button class="btn btn-outline-primary" type="submit">Filtrar</button>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Cidade/UF</th><th>Animais ativos</th><th>Situação</th><th></th></tr></thead>
                <tbody id="tabelaTutores"><tr><td colspan="7" class="text-center text-muted py-3">Carregando...</td></tr></tbody>
            </table>
        </div>
    </div>
</main>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/comum.js"></script>
<script src="js/tutores.js"></script>
</body>
</html>
