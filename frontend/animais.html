<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animais - Clínica Vet</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div id="menu"></div>
<main class="container py-3">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0">Animais</h1>
        <button id="botaoNovo" class="btn btn-primary">Novo animal</button>
    </div>
    <div id="mensagens"></div>

    <!-- Formulário de cadastro/alteração -->
    <div class="card mb-3 d-none" id="cartaoFormulario">
        <div class="card-header" id="tituloFormulario">Novo animal</div>
        <div class="card-body">
            <form id="formAnimal" novalidate>
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label" for="nome">Nome *</label>
                        <input class="form-control" id="nome" name="nome" maxlength="100" required>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label" for="tutorId">Tutor * <span class="texto-pequeno text-muted">(só tutores ativos)</span></label>
                        <select class="form-select" id="tutorId" name="tutorId" required></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="especieId">Espécie *</label>
                        <select class="form-select" id="especieId" name="especieId" required></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="racaId">Raça</label>
                        <select class="form-select" id="racaId" name="racaId"></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="sexo">Sexo</label>
                        <select class="form-select" id="sexo" name="sexo">
                            <option value="">Não informado</option>
                            <option value="M">Macho</option>
                            <option value="F">Fêmea</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="cor">Cor</label>
                        <input class="form-control" id="cor" name="cor" maxlength="50">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="peso">Peso (kg)</label>
                        <input class="form-control" id="peso" name="peso" inputmode="decimal" placeholder="12,5">
                    </div>
                </div>

                <div class="mt-3">
                    <span class="form-label d-block">Nascimento *</span>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipoNascimento" id="porData" value="data" checked>
                        <label class="form-check-label" for="porData">Sei a data</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipoNascimento" id="porIdade" value="idade">
                        <label class="form-check-label" for="porIdade">Idade estimada</label>
                    </div>
                </div>
                <div class="row g-2 mt-1">
                    <div class="col-md-4" id="campoData">
                        <label class="form-label" for="dataNascimento">Data de nascimento</label>
                        <input type="date" class="form-control" id="dataNascimento" name="dataNascimento">
                    </div>
                    <div class="col-6 col-md-2 d-none campoIdade">
                        <label class="form-label" for="idadeAnos">Anos</label>
                        <input type="number" class="form-control" id="idadeAnos" name="idadeAnos" min="0" max="50">
                    </div>
                    <div class="col-6 col-md-2 d-none campoIdade">
                        <label class="form-label" for="idadeMeses">Meses</label>
                        <input type="number" class="form-control" id="idadeMeses" name="idadeMeses" min="0" max="11">
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-success">Salvar</button>
                    <button type="button" class="btn btn-outline-secondary" id="botaoCancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Filtros e lista -->
    <form id="formFiltro" class="row g-2 mb-2">
        <div class="col-md-5">
            <input class="form-control" name="busca" placeholder="Buscar por animal, tutor ou microchip">
        </div>
        <div class="col-6 col-md-3">
            <select class="form-select" name="especieId" id="filtroEspecie"><option value="">Todas as espécies</option></select>
        </div>
        <div class="col-6 col-md-2">
            <select class="form-select" name="situacao">
                <option value="ativo">Ativos</option>
                <option value="inativo">Inativos</option>
                <option value="">Todos</option>
            </select>
        </div>
        <div class="col-md-2 d-grid">
            <button class="btn btn-outline-primary" type="submit">Filtrar</button>
        </div>
    </form>
    <div id="avisoTutor" class="mb-2"></div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Nome</th><th>Espécie / raça</th><th>Sexo</th><th>Tutor</th><th>Microchip</th><th>Situação</th><th></th></tr></thead>
                <tbody id="tabelaAnimais"><tr><td colspan="7" class="text-center text-muted py-3">Carregando...</td></tr></tbody>
            </table>
        </div>
    </div>
</main>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/comum.js"></script>
<script src="js/animais.js"></script>
</body>
</html>
